<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>COVID-19 Fake News Detection</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="overlay">
    <div class="container">
      <h1>COVID-19 Fake News Detection</h1>
      <form method="POST" action="/">
        <label>Enter News Text</label>
        <input type="text" id="text" name="text" placeholder="Enter a news headline" required>
        <input type="submit" value="Analyze">
      </form>
      {% if prediction %}
      <div class="result">
        <p><strong>Prediction:</strong> {{ prediction }}</p>
        <p><strong>Analyzed Text:</strong> {{ input_text }}</p>
      </div>
      {% elif error %}
      <div class="error">{{ error }}</div>
      {% endif %}
    </div>
  </div>
</body>
</html>
